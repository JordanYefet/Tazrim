# Refreshes the live read-only demo every Monday (or by hand: Actions -> Demo -> Run workflow).
#
# Vercel builds the demo from the `release` branch through its GitHub link; a
# release pushes that branch, so it deploys by itself. This only rebuilds the
# same code, so the demo's year of made-up data (built at deploy time,
# scripts/seed-demo.mjs) runs up to the current week between releases.
#
# Needs the VERCEL_DEPLOY_HOOK secret (Vercel: Settings -> Git -> Deploy Hooks,
# branch `release`); without it, it says so and does nothing.
name: Demo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild on Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::No VERCEL_DEPLOY_HOOK secret: the demo was not rebuilt"; exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" >/dev/null
          echo "Vercel is rebuilding the demo"
