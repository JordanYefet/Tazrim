# A release, on demand: Actions -> Release -> Run workflow (on main). Nothing to fill in:
# the version follows the newest release tag, bumped by the biggest change among the PRs
# merged since then, read from their title prefixes (.github/scripts/release-bump.sh):
# only fix: PRs 1.4.2 -> 1.4.3, any feat: or unprefixed one -> 1.5.0, any <type>!: -> 2.0.0.
# The run summary lists the PRs and what each one counted as.
#
#   1. the CI checks on main
#   2. the release commit: main is merged into the `release` branch, then one
#      commit, "Release v<version>", sets package.json's version (the About page
#      shows it); main itself never gets a bot commit, and `release` only moves
#      forward (no force push), so it can be protected
#   3. the Docker image to ghcr.io/<owner>/tazrim as <version>, <major>.<minor> and
#      latest: amd64 and arm64 built side by side, each on a runner of its own chip
#      (no emulation), from the same files as that commit, then joined under one name
#   4. then, only once the image is pushed: the `release` branch and the tag
#      v<version> go up, and the GitHub release is created (notes from the merged PRs)
#
# Vercel builds the live demo from the `release` branch through its GitHub
# link (vercel.json allows that branch only), so each release updates the demo.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the merged PRs' titles
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        name: Version and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main (this run is on $GITHUB_REF)"; exit 1
          fi
          prs=$(bash .github/scripts/release-prs.sh)
          BUMP=$(cut -f2- <<< "$prs" | bash .github/scripts/release-bump.sh)
          VERSION=$(bash .github/scripts/next-version.sh "$BUMP")
          echo "::notice::Releasing v$VERSION ($BUMP)"
          {
            echo "### Releasing v$VERSION ($BUMP)"
            echo
            if [ -z "$prs" ]; then
              echo "No PRs merged since the last release, so a minor release."
            else
              echo "The biggest change among the PRs merged since the last release decides it: \`fix:\` patch, \`feat:\` minor, \`<type>!:\` major, no prefix minor."
              echo
              echo "| PR | Title | Release |"
              echo "| --- | --- | --- |"
              while IFS=$'\t' read -r n title; do
                b=$(bash .github/scripts/release-bump.sh --each <<< "$title" | cut -f1)
                echo "| #$n | ${title//|/\\|} | $b |"
              done <<< "$prs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  check:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  # One image per chip, each on a machine of that chip (no emulation), side by side.
  # Each is pushed by digest only (no tag yet); `build` joins them under the tags.
  image:
    name: Image (${{ matrix.arch }})
    needs: [validate, check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The same files as the release commit (`build` below): main plus this version
      - name: Version
        run: npm pkg set version="$VERSION"

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tazrim" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: type=raw,value=v${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Tazrim
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: Release commit and Docker image
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git checkout -B release origin/release
            # A merge that records main as merged but takes main's files exactly: a
            # line-by-line merge (even -X theirs) can mix the two package.json files
            # and drop dependencies (v1.10.0's first run lost next). The next line
            # sets the version again, the only thing release adds.
            git merge --no-ff -s ours --no-commit "$GITHUB_SHA"
            git read-tree -u --reset "$GITHUB_SHA"
            git commit -m "Merge main for v$VERSION"
            git diff --quiet "$GITHUB_SHA" HEAD || { echo "::error::release differs from main after the merge"; exit 1; }
          else
            git checkout -B release "$GITHUB_SHA"
          fi
          npm pkg set version="$VERSION"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tazrim" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=raw,value=latest

      # Both chips' images under one name: Docker picks the one for the machine it runs on
      - name: Tag both images as one
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2 || { echo "::error::expected 2 image digests, got: ${digests[*]}"; exit 1; }
          tags=()
          while read -r t; do tags+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${digests[@]/#/$IMAGE@sha256:}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ steps.name.outputs.image }}

      # Only now that the image exists: a failed build leaves no tag behind, so the run can be repeated
      - name: Push the release branch and tag
        run: git push origin release "refs/tags/v$VERSION"

  release:
    name: GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tazrim"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Docker image: \`$image:$VERSION\` (also \`latest\`)"
