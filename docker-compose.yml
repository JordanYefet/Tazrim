# Tazrim with one command:   docker compose up -d   ->   http://localhost:3000
#
# Another port:   TAZRIM_PORT=3005 docker compose up -d   (or put TAZRIM_PORT=3005 in a .env file)
# Demo data:      TAZRIM_DEMO=1 docker compose up -d      (only fills an empty database)
# Update:         docker compose pull && docker compose up -d
#
# All data is in the "tazrim-data" volume on this machine (/data/tazrim.db inside the container).
services:
  tazrim:
    # The published image (amd64 + arm64); TAZRIM_VERSION=1.0.0 pins a version.
    # To build it yourself instead: docker build -t ghcr.io/jordanyefet/tazrim:latest .
    image: ghcr.io/jordanyefet/tazrim:${TAZRIM_VERSION:-latest}
    ports:
      - "${TAZRIM_PORT:-3000}:3000"
    environment:
      TAZRIM_DEMO: "${TAZRIM_DEMO:-0}"
    volumes:
      - tazrim-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3

volumes:
  tazrim-data:
