http_access allow from_updater github
# Deny by default: nothing else may use this proxy
http_access deny all

# --- No cache: Squid is a gatekeeper here, not a cache -----------------------------
cache deny all

# --- Don't leak anything about the client upstream ---------------------------------
forwarded_for delete
via off

# --- Logs -------------------------------------------------------------------------
# Squid starts as root and drops to the "proxy" user, which cannot write to the container's
# stdout, so the access log is a file. The image's entrypoint also copies it to the container
# log:  docker compose logs squid   (or:  docker compose exec squid tail -f /var/log/squid/access.log)
# Format: time  elapsed-ms  client  result/status  bytes  method  url  user  hierarchy/peer  type  port
# (the last field, the port the client used, tells the app which provider's sync it was: ENG-142)
# TCP_DENIED/403 = refused by the rules above; TCP_TUNNEL/200 = an HTTPS tunnel that was allowed.
# Files Squid creates (the log) are readable by the app, which shows what was blocked (ENG-134)
umask 022
logformat tazrim %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt %lp
access_log daemon:/var/log/squid/access.log tazrim
cache_store_log none
