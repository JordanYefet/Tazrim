# Squid for the allowlist SURVEY (scripts/egress-survey.mjs, ENG-131). Not for the app.
# Learning mode in its purest form: allow everything from the host running the survey and
# log it. The survey opens each provider's login page (nothing typed) in Chromium through
# this proxy, then reads access.log to see every host the page contacted.
http_port 3128
acl web_port port 80 443
http_access deny !web_port
http_access allow all
cache deny all
forwarded_for delete
via off
access_log daemon:/var/log/squid/access.log squid
cache_store_log none
